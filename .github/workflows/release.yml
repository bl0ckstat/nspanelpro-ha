# Build a signed APK on every vN.N.N tag and attach it to the release.
#
# The fleet watchdog resolves upgrades by release tag and downloads the asset
# by name, so two things here are load-bearing and must not drift:
#   * the tag is vN.N.N and must match versionName in app/build.gradle.kts
#   * the asset is named app-release.apk
#
# Signing key: an APK signed with a different key cannot be installed over the
# existing one. Android refuses the upgrade, and every panel would need
# uninstalling by hand — which also wipes ha_url and leaves a blank screen. The
# keystore in ANDROID_KEYSTORE_BASE64 must be the same one used for previous
# releases, forever.
name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Refuse to publish a release whose tag disagrees with the version the
      # app reports. The watchdog compares the two to decide whether a panel is
      # current; if they disagree it will reinstall the same APK on every pass.
      - name: Check tag matches versionName
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(grep -oE 'versionName *= *"[^"]+"' app/build.gradle.kts | head -1 | cut -d'"' -f2)
          echo "tag=$tag versionName=$version"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $version"
            exit 1
          fi

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set — the build would"
            echo "::error::produce an unsigned APK that cannot be installed."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          # keystore.properties is gitignored; the build reads it if present.
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build
        run: ./gradlew --no-daemon assembleRelease

      # The build emits app/build/outputs/apk/release/app-release.apk. Assert it
      # rather than trust it: a rename upstream would silently publish a release
      # the watchdog cannot download.
      - name: Verify the asset name and that it is signed
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          test -f "$apk" || { echo "::error::$apk not found"; exit 1; }
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "$apk" \
            || { echo "::error::APK is not signed"; exit 1; }

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            app/build/outputs/apk/release/app-release.apk \
          || gh release upload "$GITHUB_REF_NAME" \
            app/build/outputs/apk/release/app-release.apk --clobber

      - name: Remove the keystore
        if: always()
        run: rm -f keystore.properties "$RUNNER_TEMP/release.jks"

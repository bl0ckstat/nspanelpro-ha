# Brick & Brass — Home Assistant native theme
# Mode-less on purpose: the wall panels' WebViews report a light colour
# scheme, so a dark-mode-only theme silently fails to apply there. One
# palette, every device.
Brick and Brass:
  primary-background-color: "#171210"
  secondary-background-color: "#171210"
  card-background-color: "#221A15"
  ha-card-background: "#221A15"
  ha-card-border-color: "#4C3C2D"
  ha-card-border-width: "1px"
  ha-card-border-radius: "10px"
  ha-card-box-shadow: "none"
  divider-color: "#4C3C2D"
  primary-text-color: "#F5EDE0"
  secondary-text-color: "#B5A58D"
  disabled-text-color: "#8C7A63"
  text-primary-color: "#F5EDE0"
  primary-color: "#B75A33"          # terracotta — actions
  accent-color: "#C89A4B"           # brass — on-states
  state-icon-color: "#B5A58D"
  state-icon-active-color: "#C89A4B"
  state-active-color: "#C89A4B"
  paper-item-icon-color: "#B5A58D"
  paper-item-icon-active-color: "#C89A4B"
  state-light-active-color: "#C89A4B"
  state-switch-active-color: "#C89A4B"
  state-fan-active-color: "#C89A4B"
  state-cover-active-color: "#C89A4B"
  state-climate-cool-color: "#C89A4B"
  state-climate-heat-color: "#B75A33"
  state-climate-auto-color: "#C89A4B"
  state-climate-dry-color: "#C89A4B"
  state-climate-fan_only-color: "#C89A4B"
  slider-color: "#B75A33"
  slider-secondary-color: "#C89A4B"
  slider-track-color: "#2A211A"
  switch-checked-color: "#C89A4B"
  switch-checked-button-color: "#C89A4B"
  switch-checked-track-color: "rgba(200,154,75,0.4)"
  switch-unchecked-button-color: "#B5A58D"
  switch-unchecked-track-color: "#2A211A"
  mdc-theme-primary: "#B75A33"
  primary-font-family: "Archivo, sans-serif"
  paper-font-common-base_-_font-family: "Archivo, sans-serif"
  paper-font-body1_-_font-family: "Archivo, sans-serif"
  paper-font-headline_-_font-family: "Archivo, sans-serif"
  app-header-background-color: "#171210"
  app-header-text-color: "#F5EDE0"
  sidebar-background-color: "#171210"
  sidebar-icon-color: "#B5A58D"
  sidebar-selected-icon-color: "#C89A4B"
  sidebar-selected-text-color: "#F5EDE0"
  input-fill-color: "#2A211A"
  input-ink-color: "#F5EDE0"
  input-label-ink-color: "#B5A58D"
  error-color: "#B75A33"
  warning-color: "#C89A4B"
  success-color: "#C89A4B"
  info-color: "#B5A58D"
  # Tokens the faceplate cards read directly.
  faceplate-raised-bg: "#2A211A"
  faceplate-on-fill: "rgba(200,154,75,0.16)"
  faceplate-action-fill: "rgba(183,90,51,0.18)"
  faceplate-action-active-text: "#D98A5F"
